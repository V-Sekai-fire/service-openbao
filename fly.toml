app = 'weftspun-bao'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.fdb'

[env]
  BAO_ADDR = 'https://[::]:8200'
  BAO_API_ADDR = 'https://weftspun-bao.internal:8200'
  BAO_CLUSTER_ADDR = 'https://weftspun-bao.internal:8201'

[[mounts]]
  source = 'bao_data'
  destination = '/bao/data'

[[services]]
  protocol = 'tcp'
  internal_port = 2222
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[services.ports]]
    port = 2222

[[vm]]
  size = 'shared-cpu-1x'
  memory = "256mb"
